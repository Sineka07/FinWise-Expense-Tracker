<!DOCTYPE html>
<html>
<head>
    <title>FinWise - Subscriptions</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html"><i class="fas fa-wallet"></i> FinWise</a>
            <a href="dashboard.html" class="btn btn-outline-light btn-sm">Back</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>🔄 Subscriptions</h2>
        <div class="row mt-3">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-info text-white">Add Subscription</div>
                    <div class="card-body">
                        <form id="subscriptionForm">
                            <input type="text" class="form-control mb-2" id="serviceName" placeholder="Service Name">
                            <input type="number" class="form-control mb-2" id="amount" placeholder="Amount">
                            <input type="date" class="form-control mb-2" id="renewalDate">
                            <button type="submit" class="btn btn-info w-100">Add</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-dark text-white">My Subscriptions</div>
                    <div class="card-body">
                        <table class="table table-striped">
                            <thead><tr><th>Service</th><th>Amount</th><th>Renewal</th><th>Days Left</th></tr></thead>
                            <tbody id="subscriptionBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/subscriptions.js"></script>
</body>
</html>
