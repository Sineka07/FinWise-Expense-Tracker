<!DOCTYPE html>
<html>
<head>
    <title>FinWise - Goals</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html"><i class="fas fa-wallet"></i> FinWise</a>
            <a href="dashboard.html" class="btn btn-outline-light btn-sm">Back</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>🎯 Financial Goals</h2>
        <div class="row mt-3">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-success text-white">Add Goal</div>
                    <div class="card-body">
                        <form id="goalForm">
                            <input type="text" class="form-control mb-2" id="goalName" placeholder="Goal Name">
                            <input type="number" class="form-control mb-2" id="targetAmount" placeholder="Target Amount">
                            <input type="date" class="form-control mb-2" id="targetDate">
                            <button type="submit" class="btn btn-success w-100">Add Goal</button>
                        </form>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-dark text-white">My Goals</div>
                    <div class="card-body" id="goalList"></div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/goals.js"></script>
</body>
</html>
