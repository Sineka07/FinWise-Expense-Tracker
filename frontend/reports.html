<!DOCTYPE html>
<html>
<head>
    <title>FinWise - Reports</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html"><i class="fas fa-wallet"></i> FinWise</a>
            <a href="dashboard.html" class="btn btn-outline-light btn-sm">Back</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>📄 Reports</h2>
        <div class="row mt-3">
            <div class="col-md-12">
                <div class="card">
                    <div class="card-header bg-dark text-white">Generate Report</div>
                    <div class="card-body">
                        <div class="row">
                            <div class="col-md-3">
                                <select class="form-select" id="reportType">
                                    <option>Monthly</option><option>Yearly</option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <input type="month" class="form-control" id="reportMonth">
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-primary" onclick="generatePDF()"><i class="fas fa-file-pdf"></i> Generate PDF</button>
                            </div>
                            <div class="col-md-3">
                                <button class="btn btn-success" onclick="sendReport()"><i class="fas fa-envelope"></i> Send Report</button>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/reports.js"></script>
</body>
</html>
