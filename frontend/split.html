<!DOCTYPE html>
<html>
<head>
    <title>FinWise - Bill Split</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar navbar-dark bg-dark">
        <div class="container">
            <a class="navbar-brand" href="dashboard.html"><i class="fas fa-wallet"></i> FinWise</a>
            <a href="dashboard.html" class="btn btn-outline-light btn-sm">Back</a>
        </div>
    </nav>

    <div class="container mt-4">
        <h2>👥 Bill Split</h2>
        <div class="row mt-3">
            <div class="col-md-4">
                <div class="card">
                    <div class="card-header bg-warning">Split Bill</div>
                    <div class="card-body">
                        <form id="splitForm">
                            <input type="text" class="form-control mb-2" id="description" placeholder="Description">
                            <input type="number" class="form-control mb-2" id="totalAmount" placeholder="Total Amount">
                            <input type="number" class="form-control mb-2" id="people" placeholder="Number of People">
                            <button type="submit" class="btn btn-warning w-100">Split Now</button>
                        </form>
                        <div class="mt-3 alert alert-info">Each person pays: ₹<span id="perPerson">0</span></div>
                    </div>
                </div>
            </div>
            <div class="col-md-8">
                <div class="card">
                    <div class="card-header bg-dark text-white">Split History</div>
                    <div class="card-body">
                        <table class="table table-striped">
                            <thead><tr><th>Description</th><th>Total</th><th>Per Person</th><th>Date</th></tr></thead>
                            <tbody id="splitBody"></tbody>
                        </table>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
    <script src="js/split.js"></script>
</body>
</html>
